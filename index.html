<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Doces Di | Cardápio Online</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-color: #fcf8f5;
            --text-color: #4a3b32;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --sidebar-bg: #ffffff;
            --border-color: #f0e4da;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --accent-color: #d4a373;
            --accent-hover: #c49a6c;
            --success: #27ae60;
            --error: #e74c3c;
            --warning: #f39c12;
        }
        
        body.dark {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --card-bg: #16213e;
            --header-bg: #0f3460;
            --sidebar-bg: #16213e;
            --border-color: #2a3a5e;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
            padding-bottom: 80px;
        }
        
        /* Header */
        header {
            background-color: var(--header-bg);
            padding: 60px 20px 20px 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        
        header h1 { color: var(--accent-color); font-size: clamp(1.5rem, 5vw, 2rem); }
        header p { opacity: 0.7; font-size: 0.9rem; }
        
        /* Botões flutuantes */
        .top-buttons {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            z-index: 1000;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .btn-icon {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: transform 0.2s;
        }
        
        .btn-icon:hover { transform: scale(1.05); }
        
        .btn-admin {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: linear-gradient(135deg, #654321, #4a3b32);
        }
        
        .btn-logout { background: #e74c3c; }
        .btn-login { background: var(--accent-color); }
        
        /* Carrossel Banner */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 350px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) { .carousel-container { height: 180px; } }
        
        .carousel-slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease;
        }
        
        .carousel-slide {
            min-width: 100%;
            height: 100%;
            position: relative;
        }
        
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .carousel-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
            padding: 15px;
            text-align: center;
        }
        
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
        }
        
        .carousel-btn.prev { left: 10px; }
        .carousel-btn.next { right: 10px; }
        
        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 10;
        }
        
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
        }
        
        .carousel-dot.active { background: var(--accent-color); transform: scale(1.2); }
        
        /* Categorias Tabs */
        .categorias-wrapper { padding: 0 15px; margin-bottom: 20px; }
        
        .categorias-scroll {
            background: var(--card-bg);
            border-radius: 50px;
            padding: 10px 15px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            box-shadow: var(--shadow);
        }
        
        .categoria-tab {
            display: inline-block;
            padding: 8px 24px;
            margin: 0 4px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            color: var(--text-color);
        }
        
        .categoria-tab:hover,
        .categoria-tab.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        
        /* Carrossel Produtos */
        .produtos-wrapper { padding: 0 15px; margin-bottom: 30px; }
        
        .product-swiper { padding: 20px 5px; }
        
        .card-produto {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
            height: 100%;
        }
        
        .card-produto:hover { transform: translateY(-5px); }
        
        .card-produto img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        
        .card-produto .info { padding: 12px; }
        .card-produto .nome { font-weight: bold; font-size: 1rem; margin-bottom: 5px; color: var(--accent-color); }
        .card-produto .desc { font-size: 0.7rem; opacity: 0.7; margin-bottom: 8px; }
        .card-produto .preco { font-weight: bold; font-size: 1.1rem; color: var(--accent-color); }
        .card-produto .estoque { font-size: 0.6rem; background: var(--bg-color); padding: 2px 8px; border-radius: 20px; }
        
        .btn-comprar {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white;
            border: none;
            padding: 8px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        
        .btn-comprar:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        /* Layout Principal */
        .main-layout {
            display: flex;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 15px;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .vitrine { flex: 3; min-width: 250px; }
        
        /* Carrinho Sidebar */
        .carrinho-sidebar {
            flex: 1.2;
            background: var(--sidebar-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        
        @media (max-width: 768px) { .carrinho-sidebar { position: static; } }
        
        .carrinho-sidebar h3 {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent-color);
        }
        
        .item-carrinho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .item-carrinho .info { flex: 2; }
        .item-carrinho .info strong { font-size: 0.85rem; }
        .item-carrinho .preco { font-size: 0.7rem; color: var(--accent-color); }
        
        .controles {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-qtd {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: var(--border-color);
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-remover {
            background: none;
            border: none;
            color: var(--error);
            cursor: pointer;
            font-size: 1rem;
        }
        
        .carrinho-total {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid var(--border-color);
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .btn-finalizar {
            width: 100%;
            background: linear-gradient(135deg, var(--success), #128C7E);
            color: white;
            padding: 12px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        
        /* Busca */
        .search-box {
            background: var(--card-bg);
            border-radius: 50px;
            padding: 10px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            box-shadow: var(--shadow);
        }
        
        .search-box input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            padding: 8px 0;
            color: var(--text-color);
        }
        
        .search-box button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .modal-content h3 { color: var(--accent-color); margin-bottom: 20px; }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
        }
        .modal-content button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        
        /* Admin */
        .admin-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .admin-tab {
            padding: 8px 16px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            cursor: pointer;
        }
        .admin-tab.active {
            background: var(--accent-color);
            color: white;
        }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 20px;
        }
        .form-row .field { flex: 1; min-width: 120px; }
        .form-row label { display: block; font-size: 0.7rem; font-weight: bold; color: var(--accent-color); margin-bottom: 5px; }
        .form-row input, .form-row select, .form-row textarea {
            width: 100%;
            padding: 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
        }
        
        .lista-item {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .lista-item .campo { flex: 1; min-width: 100px; }
        .lista-item input, .lista-item select {
            padding: 6px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            width: 100%;
        }
        
        .btn-salvar { color: var(--success); background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 5px; }
        .btn-excluir { color: var(--error); background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 5px; }
        
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-card .value { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); }
        
        footer {
            background-color: #4a3b32;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 3000;
            animation: fadeInUp 0.3s ease;
        }
        .toast.error { background: var(--error); }
        .toast.warning { background: var(--warning); }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        .swiper-button-next, .swiper-button-prev {
            color: var(--accent-color);
            background: var(--card-bg);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            box-shadow: var(--shadow);
        }
        .swiper-button-next:after, .swiper-button-prev:after { font-size: 16px; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="top-buttons">
    <button class="btn-icon" id="themeToggle">🌙 Tema</button>
    <div id="authButtons"></div>
</div>
<button class="btn-icon btn-admin" id="btnAdmin">🔧 Admin</button>

<header>

<div class="carousel-container" id="carouselContainer">

</div>

<div class="main-layout">

</div>

<footer>

    <p>📞 (21) 96578-3597</p>

<!-- Modal Login -->

    <div class="modal-content">

        <input type="text" id="loginEmail" placeholder="E-mail">
        <input type="password" id="loginSenha" placeholder="Senha">

<!-- Modal Admin -->
<div id="modalAdmin" class="modal">
    <div class="modal-content" style="max-width: 95%; width: 95%;">
        <h3>🔧 Painel Administrativo</h3>
        
        <div class="admin-tabs" id="adminTabs">
            <div class="admin-tab active" data-tab="categorias">🏷️ Categorias</div>
            <div class="admin-tab" data-tab="produtos">🍰 Produtos</div>

        <!-- Categorias -->
        <div id="tabCategorias" class="admin-panel active">
            <div class="form-row">
                <div class="field"><label>Nome</label><input type="text" id="catNome" placeholder="Ex: Bolos"></div>
                <div class="field"><label>Ícone</label><input type="text" id="catIcone" placeholder="🍰" value="📁"></div>

        </div>
        
        <!-- Produtos -->
        <div id="tabProdutos" class="admin-panel">
            <div class="form-row">
                <div class="field"><label>Nome</label><input type="text" id="prodNome" placeholder="Produto"></div>
                <div class="field"><label>Descrição</label><textarea id="prodDesc" rows="2" placeholder="Descrição"></textarea></div>
                <div class="field"><label>Preço</label><input type="number" step="0.01" id="prodPreco" placeholder="0.00"></div>
                <div class="field"><label>Estoque</label><input type="number" id="prodEstoque" placeholder="10"></div>
                <div class="field"><label>Categoria</label><select id="prodCategoriaSelect"></select></div>
                <div class="field"><label>Imagem URL</label><input type="text" id="prodImagem" placeholder="https://..."></div>
                <div><button id="btnAddProduto" style="width: auto; padding: 8px 20px;">➕ Adicionar</button></div>
            </div>
            <div id="listaProdutos"></div>
            <button id="btnSalvarProdutos" class="btn-finalizar" style="background: var(--success);">💾 Salvar Produtos</button>
        </div>
        
        <!-- Slides -->
        <div id="tabSlides" class="admin-panel">
            <div class="form-row">
                <div class="field"><label>Imagem URL</label><input type="text" id="slideImagem" placeholder="https://..."></div>
                <div class="field"><label>Título</label><input type="text" id="slideTitulo" placeholder="Título"></div>
                <div class="field"><label>Descrição</label><input type="text" id="slideDesc" placeholder="Descrição"></div>
                <div><button id="btnAddSlide" style="width: auto; padding: 8px 20px;">➕ Adicionar</button></div>
            </div>
            <div id="listaSlides"></div>
            <button id="btnSalvarSlides" class="btn-finalizar" style="background: var(--success);">💾 Salvar Slides</button>
        </div>
        
        <!-- Dashboard -->
        <div id="tabDashboard" class="admin-panel">
            <div class="dashboard-stats" id="dashboardStats"></div>
            <div id="topProdutosDashboard"></div>
        </div>
        
        <button id="btnFecharAdmin" style="background: var(--error); margin-top: 20px;">Fechar</button>
    </div>
</div>

<script>
    // CONFIGURAÇÃO SUPABASE
    const SUPABASE_URL = "https://opixfppyhbiyqrilebfb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9waXhmcHB5aGJpeXFyaWxlYmZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1Mjk4NTAsImV4cCI6MjA5NjEwNTg1MH0.j4hqWiZeFFkgprakbqeeIv1J28W9Qz8XXpWKk8lMR_I";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // DADOS GLOBAIS
    let categorias = [];
    let produtos = [];
    let slides = [];
    let carrinho = [];
    let usuarioLogado = null;
    let swiperInstance = null;
    let categoriaAtiva = null;
    let slideIndex = 0;
    
    // FUNÇÕES AUXILIARES
    function showToast(msg, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function hashSenha(s) { return CryptoJS.SHA256(s).toString(); }
    
    // ==================== CATEGORIAS ====================
    async function carregarCategorias() {
        try {
            const { data, error } = await supabase.from('categorias').select('*').order('ordem');
            if (error) throw error;
            categorias = data || [];
            renderizarCategoriasFront();
            renderizarAdminCategorias();
            popularSelectCategorias();
        } catch (error) {
            showToast('Erro ao carregar categorias: ' + error.message, 'error');
        }
    }
    
    function renderizarCategoriasFront() {
        const container = document.getElementById('categoriasList');
        if (!container) return;
        
        if (categorias.length === 0) {
            container.innerHTML = '<span style="padding:8px 20px;">Nenhuma categoria</span>';
            return;
        }
        
        container.innerHTML = categorias.map(cat => `
            <span class="categoria-tab ${categoriaAtiva === cat.id ? 'active' : ''}" data-id="${cat.id}">
                ${cat.icone || '📁'} ${cat.nome}

    function renderizarCarrossel() {

        if (!container) return;
        
        if (slides.length === 0) {
            container.innerHTML = '<div class="carousel-slide"><img src="https://placehold.co/1200x400"><div class="carousel-caption"><h3>Doces Di</h3></div></div>';
            return;
        }
        
        container.innerHTML = slides.map(slide => `

            </div>
        `).join('');
        
        dotsContainer.innerHTML = slides.map((_, i) => `<div class="carousel-dot ${i === slideIndex ? 'active' : ''}" data-index="${i}"></div>`).join('');
        
        document.querySelectorAll('.carousel-dot').forEach(dot => {
            dot.addEventListener('click', () => {
                slideIndex = parseInt(dot.dataset.index);
                atualizarCarrossel();
            });
        });
        
        if (window.carrosselInterval) clearInterval(window.carrosselInterval);
        window.carrosselInterval = setInterval(() => {
            slideIndex = (slideIndex + 1) % slides.length;
            atualizarCarrossel();
        }, 5000);
    }
    
    function atualizarCarrossel() {
        const container = document.getElementById('carouselSlides');
        if (container) container.style.transform = `translateX(-${slideIndex * 100}%)`;
        document.querySelectorAll('.carousel-dot').forEach((dot, i) => {
            dot.classList.toggle('active', i === slideIndex);

    // ==================== CARRINHO ====================
    function adicionarAoCarrinho(id) {
        const produto = produtos.find(p => p.id === id);
        if (!produto || produto.estoque <= 0) {
            showToast('Produto sem estoque!', 'error');
            return;
        }
        
        const existente = carrinho.find(i => i.id === id);
        if (existente) {
            if (existente.quantidade + 1 > produto.estoque) {
                showToast(`Estoque máximo: ${produto.estoque}`, 'warning');
                return;
            }
            existente.quantidade++;
        } else {
            carrinho.push({ id, nome: produto.nome, preco: produto.preco, quantidade: 1 });
        }
        
        salvarCarrinho();
        atualizarCarrinho();
        showToast(`${produto.nome} adicionado!`);
    }
    
    function atualizarCarrinho() {
        const container = document.getElementById('carrinhoLista');
        const totalSpan = document.getElementById('carrinhoTotal');
        
        if (carrinho.length === 0) {
            container.innerHTML = '<p style="text-align:center;">Carrinho vazio</p>';
            totalSpan.innerText = 'R$ 0,00';
            return;
        }
        
        let total = 0;
        container.innerHTML = '';
        carrinho.forEach(item => {
            const subtotal = item.preco * item.quantidade;
            total += subtotal;
            container.innerHTML += `
                <div class="item-carrinho">
                    <div class="info">
                        <strong>${item.nome}</strong>
                        <div class="preco">R$ ${item.preco.toFixed(2)}</div>
                    </div>
                    <div class="controles">
                        <button class="btn-qtd" onclick="alterarQuantidade(${item.id}, -1)">-</button>
                        <span>${item.quantidade}</span>
                        <button class="btn-qtd" onclick="alterarQuantidade(${item.id}, 1)">+</button>
                        <button class="btn-remover" onclick="removerDoCarrinho(${item.id})">🗑️</button>
                    </div>
                    <span>R$ ${subtotal.toFixed(2)}</span>
                </div>
            `;
        });
        totalSpan.innerText = `R$ ${total.toFixed(2)}`;
    }
    
    window.alterarQuantidade = function(id, delta) {
        const item = carrinho.find(i => i.id === id);
        const produto = produtos.find(p => p.id === id);
        
        if (item) {
            if (delta === -1 && item.quantidade > 1) {
                item.quantidade--;
            } else if (delta === -1 && item.quantidade === 1) {
                removerDoCarrinho(id);
                return;
            } else if (delta === 1 && produto && item.quantidade + 1 <= produto.estoque) {
                item.quantidade++;
            } else if (delta === 1) {
                showToast(`Estoque máximo: ${produto.estoque}`, 'warning');
                return;
            }
            salvarCarrinho();
            atualizarCarrinho();
        }
    };
    
    window.removerDoCarrinho = function(id) {
        carrinho = carrinho.filter(i => i.id !== id);
        salvarCarrinho();
        atualizarCarrinho();
    };
    
    function salvarCarrinho() { localStorage.setItem('carrinho_docesdi', JSON.stringify(carrinho)); }
    function carregarCarrinho() { 
        const data = localStorage.getItem('carrinho_docesdi');
        carrinho = data ? JSON.parse(data) : [];
        atualizarCarrinho();
    }
    
    function finalizarPedido() {
        if (carrinho.length === 0) {
            showToast('Carrinho vazio!', 'warning');
            return;
        }
        
        let msg = '🍰 *PEDIDO DOCES DI* 🍰\n\n';
        msg += `👤 ${usuarioLogado?.nome || 'Cliente'}\n`;
        msg += `📞 ${usuarioLogado?.telefone || 'Não informado'}\n\n`;
        msg += '📋 *ITENS:*\n';
        carrinho.forEach(i => msg += `• ${i.quantidade}x ${i.nome} - R$ ${(i.preco * i.quantidade).toFixed(2)}\n`);
        const total = carrinho.reduce((s, i) => s + i.preco * i.quantidade, 0);
        msg += `\n💰 *TOTAL:* R$ ${total.toFixed(2)}`;
        
        carrinho = [];
        salvarCarrinho();
        atualizarCarrinho();
        
        window.open(`https://wa.me/5521965783597?text=${encodeURIComponent(msg)}`, '_blank');
        showToast('Pedido enviado!');
    }

        }
        const filtrados = produtos.filter(p => p.nome.toLowerCase().includes(termo));
        renderizarProdutosSwiper(filtrados);
    }
    
    // ==================== INICIALIZAÇÃO ====================
    async function inicializar() {
        // Carregar dados
        await carregarCategorias();
        await carregarProdutos();
        await carregarSlides();
        carregarCarrinho();
        
        // Recuperar sessão
        const savedUser = localStorage.getItem('usuario_docesdi');
        if (savedUser) {
            usuarioLogado = JSON.parse(savedUser);
        }
        atualizarBotoesAuth();
        
        // Eventos
        document.getElementById('themeToggle')?.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme_docesdi', document.body.classList.contains('dark') ? 'dark' : 'light');
        });
        
        const savedTheme = localStorage.getItem('theme_docesdi');
        if (savedTheme === 'dark') document.body.classList.add('dark');
        
        document.getElementById('carouselPrev')?.addEventListener('click', () => {
            slideIndex = (slideIndex - 1 + slides.length) % slides.length;
            atualizarCarrossel();
        });
        document.getElementById('carouselNext')?.addEventListener('click', () => {
            slideIndex = (slideIndex + 1) % slides.length;
            atualizarCarrossel();
        });
        document.getElementById('btnSearch')?.addEventListener('click', buscarProdutos);
        document.getElementById('searchInput')?.addEventListener('keyup', (e) => { if(e.key === 'Enter') buscarProdutos(); });
        document.getElementById('btnFinalizar')?.addEventListener('click', finalizarPedido);
        document.getElementById('btnAdmin')?.addEventListener('click', abrirAdmin);
        document.getElementById('btnFecharAdmin')?.addEventListener('click', () => document.getElementById('modalAdmin').style.display = 'none');
        document.getElementById('btnFecharLogin')?.addEventListener('click', () => document.getElementById('modalLogin').style.display = 'none');
        
        document.getElementById('btnAddCategoria')?.addEventListener('click', adicionarCategoria);
        document.getElementById('btnAddProduto')?.addEventListener('click', adicionarProduto);
        document.getElementById('btnAddSlide')?.addEventListener('click', adicionarSlide);
        document.getElementById('btnSalvarCategorias')?.addEventListener('click', async () => { await carregarCategorias(); showToast('Atualizado!'); });
        document.getElementById('btnSalvarProdutos')?.addEventListener('click', async () => { await carregarProdutos(); showToast('Atualizado!'); });
        document.getElementById('btnSalvarSlides')?.addEventListener('click', async () => { await carregarSlides(); showToast('Atualizado!'); });
        
        document.getElementById('btnLogin')?.addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            const resultado = await fazerLogin(email, senha);
            if (resultado) {
                usuarioLogado = resultado.dados;
                localStorage.setItem('usuario_docesdi', JSON.stringify(usuarioLogado));
                atualizarBotoesAuth();
                document.getElementById('modalLogin').style.display = 'none';
                showToast(`Bem-vindo, ${usuarioLogado.nome || 'Admin'}!`);
                if (resultado.tipo === 'admin') abrirAdmin();
            } else {
                showToast('Email ou senha incorretos!', 'error');
            }
        });
        
        document.getElementById('btnCadastrar')?.addEventListener('click', cadastrarCliente);
        
        initAdminTabs();
        
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) e.target.style.display = 'none';
        });
    }
    
    inicializar();
</script>
