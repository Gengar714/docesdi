<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Doces Di | Cardápio e Pedidos</title>
    <meta name="theme-color" content="#d4a373">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBR173YFP4"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-MBR173YFP4');</script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== RESET E VARIÁVEIS ===== */
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg-color:#fcf8f5;--text-color:#4a3b32;--card-bg:white;--header-bg:#fff;--sidebar-bg:white;--border-color:#f0e4da;--shadow:0 4px 15px rgba(0,0,0,0.05);--input-bg:white;--btn-bg:#d4a373;--btn-hover:#c49a6c;--accent-color:#d4a373;--border-radius:20px;--success:#27ae60;--error:#e74c3c;--warning:#f39c12}
        body.dark{--bg-color:#1a1a2e;--text-color:#e0e0e0;--card-bg:#16213e;--header-bg:#0f3460;--sidebar-bg:#16213e;--border-color:#2a3a5e;--input-bg:#1a1a2e}
        body{background-color:var(--bg-color);color:var(--text-color);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:60px;transition:all 0.3s ease}
        header{background-color:var(--header-bg);padding:60px 20px 20px;text-align:center;box-shadow:var(--shadow)}header h1{color:var(--accent-color);font-size:clamp(1.3rem,5vw,2rem)}header p{opacity:0.8;font-size:.9rem}
        .login-btn-container{position:fixed;top:10px;right:10px;z-index:1000;display:flex;gap:8px}
        .btn-login,.theme-toggle{background:linear-gradient(135deg,var(--btn-bg),var(--btn-hover));color:white;border:none;padding:8px 16px;border-radius:30px;cursor:pointer;font-weight:bold;font-size:.85rem}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;justify-content:center;align-items:center}
        .modal.ativo{display:flex}
        .modal-content{background:var(--card-bg);border-radius:var(--border-radius);padding:20px;max-width:500px;width:90%;max-height:85vh;overflow-y:auto}
        .modal-content input{width:100%;padding:10px;margin:8px 0;border-radius:25px;border:1px solid var(--border-color);background:var(--input-bg);color:var(--text-color)}
        .modal-content button{background:var(--btn-bg);color:white;border:none;padding:10px;border-radius:25px;cursor:pointer;width:100%;margin-top:10px;font-weight:bold}
        .categorias-container{margin:20px 0;padding:0 15px}.categorias-carrossel{background:#f5e6d8;border-radius:50px;padding:12px 20px;overflow-x:auto;white-space:nowrap}
        .categoria-tab{display:inline-block;padding:8px 24px;margin:0 5px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:40px;cursor:pointer}
        .categoria-tab.ativo{background:var(--accent-color);color:white}
        .content-wrapper{padding:0 15px}.produtos-carrinho-wrapper{display:flex;flex-wrap:wrap;gap:30px}
        .produtos-carrossel-wrapper{flex:3;min-width:250px}
        .card-produto-swiper{background:var(--card-bg);border-radius:var(--border-radius);overflow:hidden;box-shadow:var(--shadow);padding:15px;margin-bottom:15px}
        .carrinho-sidebar{flex:1.2;background:var(--sidebar-bg);border-radius:var(--border-radius);padding:20px;box-shadow:var(--shadow);height:fit-content}
        .item-carrinho{display:flex;justify-content:space-between;margin-bottom:10px;border-bottom:1px dashed var(--border-color);padding-bottom:5px}
        .btn-finalizar-pedido{width:100%;background:linear-gradient(135deg,#25d366,#128C7E);color:white;padding:12px;border-radius:50px;border:none;cursor:pointer;font-weight:bold;margin-top:10px}
        .toast-container{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:9999}
        .toast{padding:8px 16px;border-radius:50px;color:white;font-size:.8rem;background:var(--success)}
        .toast.error{background:var(--error)}
    </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="login-btn-container">
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <button class="btn-login" id="btnAbrirLogin">🔐 Login Cliente</button>
    <button class="theme-toggle" onclick="window.location.href='admin.html'">🔧 Painel Admin</button>
</div>

<header><h1>Doces Di</h1><p>A vida é mais doce quando compartilhada</p></header>

<div class="categorias-container"><div class="categorias-carrossel" id="categoriasCarrossel"><span>Carregando categorias...</span></div></div>

<div class="content-wrapper">
    <div class="produtos-carrinho-wrapper">
        <div class="produtos-carrossel-wrapper">
            <div id="listaProdutosFront">Carregando cardápio...</div>
        </div>
        <aside class="carrinho-sidebar">
            <h3>🛒 Seu Pedido</h3>
            <div id="itens-carrinho"><p style="text-align:center; padding:15px;">Carrinho vazio</p></div>
            <div style="font-weight:bold; display:flex; justify-content:space-between; margin-top:15px;">
                <span>Total:</span><span id="valor-total">R$ 0,00</span>
            </div>
            <button id="btn-finalizar" class="btn-finalizar-pedido">📦 FINALIZAR COMPRA</button>
        </aside>
    </div>
</div>

<div id="modalCliente" class="modal">
    <div class="modal-content">
        <h3>🔐 Identificação do Cliente</h3>
        <input type="email" id="loginEmail" placeholder="Seu e-mail">
        <input type="password" id="loginSenha" placeholder="Sua senha">
        <button id="btnLoginAction">Entrar</button>
        <button onclick="document.getElementById('modalCliente').classList.remove('ativo')" style="background:#999;">Fechar</button>
    </div>
</div>

<script>
    // Configurações do Supabase corrigidas pelo usuário
    const SUPABASE_URL = "https://opixfppyhbiyqrilebfb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInRefiI6Im9waXhmcHB5aGJpeXFyaWxlYmZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1Mjk4NTAsImV4cCI6MjA5NjEwNTg1MH0.j4hqWiZeFFkgprakbqeeIv1J28W9Qz8XXpWKk8lMR_I";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Inicialização do SDK do Mercado Pago com a sua Public Key
    const mp = new MercadoPago("APP_USR-d01d8748-97f4-4faa-aeab-a2c680b00aec", { locale: 'pt-BR' });

    let produtos = [], carrinho = [];

    // Correção ortográfica solicitada pelo usuário: 'mensaje' corrigido para 'mensagem'
    function showToast(mensagem, tipo='success'){
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${tipo}`;
        toast.innerText = mensagem;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    async function inicializarLoja(){
        // Carrega itens da vitrine direto do banco de dados
        let { data: prodData, error } = await supabaseClient.from('produtos').select('*');
        if(!error && prodData) produtos = prodData;
        renderizarVitrine();
    }

    function renderizarVitrine(){
        const container = document.getElementById('listaProdutosFront');
        if(produtos.length === 0){ container.innerHTML = "<p>Nenhum doce na vitrine hoje.</p>"; return; }
        container.innerHTML = produtos.map(p => `
            <div class="card-produto-swiper">
                <h3>${p.nome}</h3>
                <p>${p.descricao || ''}</p>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                    <strong>R$ ${p.preco.toFixed(2)}</strong>
                    <button onclick="adicionarAoCarrinho(${p.id})" style="background:var(--accent-color); color:white; border:none; padding:5px 15px; border-radius:15px; cursor:pointer;">🛒 Adicionar</button>
                </div>
            </div>
        `).join('');
    }

    window.adicionarAoCarrinho = function(id){
        const prod = produtos.find(p => p.id === id);
        if(prod){
            carrinho.push(prod);
            showToast(`${prod.nome} foi para o seu pedido!`);
            atualizarCarrinho();
        }
    }

    function atualizarCarrinho(){
        const container = document.getElementById('itens-carrinho');
        if(carrinho.length === 0) { container.innerHTML = "<p style='text-align:center;'>Carrinho vazio</p>"; return; }
        container.innerHTML = carrinho.map(item => `
            <div class="item-carrinho">
                <span>${item.nome}</span>
                <span>R$ ${item.preco.toFixed(2)}</span>
            </div>
        `).join('');
        const total = carrinho.reduce((s, i) => s + i.preco, 0);
        document.getElementById('valor-total').innerText = `R$ ${total.toFixed(2)}`;
    }

    document.getElementById('btnAbrirLogin').addEventListener('click', () => {
        document.getElementById('modalCliente').classList.add('ativo');
    });

    window.onload = inicializarLoja;
</script>
</body>
</html>
