<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Doces Di | Sistema Completo</title>
    <meta name="theme-color" content="#d4a373">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MBR173YFP4"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-MBR173YFP4');</script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== ESTILOS COMPLETOS ========== */
        :root {
            --bg-color: #fefae0;
            --text-color: #333333;
            --primary-color: #faedcd;
            --secondary-color: #f1c0e8;
            --accent-color: #d4a373;
            --card-bg: #ffffff;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
            --border-radius: 16px;
            --transition: all 0.3s ease;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --hot-color: #ff6b6b;
            --cold-color: #4ecdc4;
        }
        body.dark {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --primary-color: #1e1e1e;
            --secondary-color: #2c2c2c;
            --accent-color: #ffb703;
            --card-bg: #1d1d1d;
            --shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); transition: var(--transition); padding-top: var(--safe-top); padding-bottom: calc(70px + var(--safe-bottom)); min-height: 100vh; }
        header { background: var(--card-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); position: sticky; top: var(--safe-top); z-index: 100; transition: var(--transition); flex-wrap: wrap; gap: 10px; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.4rem; color: var(--accent-color); cursor: pointer; }
        .logo-area img { height: 45px; width: 45px; border-radius: 50%; object-fit: cover; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .btn-header { background: none; border: none; font-size: 1.4rem; color: var(--text-color); cursor: pointer; position: relative; transition: var(--transition); }
        .badge { position: absolute; top: -5px; right: -8px; background: red; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        .btn-perfil { background: var(--accent-color); color: white; padding: 6px 12px; border-radius: 30px; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: var(--transition); }
        .thermometer-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px 20px;
            border-radius: 30px;
            margin: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: var(--shadow);
        }
        .thermometer-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .temp-display { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 40px; }
        .temp-display i { font-size: 1.5rem; }
        .temp-value { font-size: 1.8rem; font-weight: bold; }
        .temp-unit { font-size: 1rem; opacity: 0.8; }
        .weather-status { display: flex; align-items: center; gap: 8px; }
        .weather-status i { font-size: 1.3rem; }
        .suggestion-card { background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 40px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: var(--transition); }
        .suggestion-card:hover { background: rgba(255,255,255,0.3); transform: scale(1.02); }
        .suggestion-card i { font-size: 1.3rem; }
        .suggestion-text { font-weight: 500; font-size: 0.9rem; }
        .refresh-weather { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 30px; cursor: pointer; }
        .refresh-weather:hover { background: rgba(255,255,255,0.3); }
        .hero-slider { margin: 15px auto; max-width: 1200px; padding: 0 15px; }
        .hero-swiper { width: 100%; height: 220px; border-radius: var(--border-radius); overflow: hidden; box-shadow: var(--shadow); }
        .hero-swiper .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .tabs-container { max-width: 1200px; margin: 15px auto; padding: 0 15px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 10px 20px; border: none; background: var(--card-bg); color: var(--text-color); border-radius: 20px; font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow); transition: var(--transition); display: flex; align-items: center; gap: 8px; }
        .tab-btn.active { background: var(--accent-color); color: white; }
        .produtos-carrossel-wrapper { max-width: 1200px; margin: 0 auto; padding: 0 15px; display: flex; flex-direction: column; gap: 30px; }
        .categoria-vitrine-secao { width: 100%; display: block; clear: both; transition: all 0.3s; }
        .categoria-vitrine-secao.hidden-category { display: none; }
        .categoria-vitrine-secao h2 { margin-bottom: 15px; font-size: 1.35rem; font-weight: 700; color: var(--text-color); display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--accent-color); padding-left: 10px; }
        .product-swiper { width: 100%; padding-bottom: 35px !important; overflow: hidden; position: relative; }
        .card-produto-swiper { background: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; box-shadow: var(--shadow); height: 100%; display: flex; flex-direction: column; transition: var(--transition); border: 1px solid rgba(0,0,0,0.03); position: relative; }
        .card-produto-swiper:hover { transform: translateY(-5px); }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #eee; display: block; }
        .card-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
        .card-nome { font-weight: bold; font-size: 1.1rem; color: var(--text-color); }
        .card-descricao { font-size: 0.85rem; color: #777; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 34px; }
        body.dark .card-descricao { color: #bbb; }
        .rating-stars { color: #ffb703; font-size: 0.85rem; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
        .btn-avaliar-pequeno { background: none; border: none; color: var(--accent-color); cursor: pointer; font-size: 0.7rem; margin-left: 5px; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .card-preco { font-weight: 800; font-size: 1.15rem; color: var(--accent-color); }
        .estoque-badge { font-size: 0.75rem; background: rgba(0,0,0,0.05); padding: 3px 8px; border-radius: 10px; font-weight: 600; }
        body.dark .estoque-badge { background: rgba(255,255,255,0.1); }
        .btn-comprar { width: 100%; padding: 10px; border: none; background: var(--accent-color); color: white; font-weight: bold; border-radius: 12px; cursor: pointer; transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: auto; }
        .btn-comprar:disabled { background: #ccc; cursor: not-allowed; }
        .site-footer { background: var(--card-bg); margin-top: 50px; padding: 30px 20px 20px; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); border-top: 1px solid rgba(0,0,0,0.05); }
        .footer-grid { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; }
        .footer-item { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-color); }
        .footer-item i { font-size: 1.2rem; color: var(--accent-color); width: 25px; }
        .footer-item a { color: var(--text-color); text-decoration: none; transition: var(--transition); }
        .footer-item a:hover { color: var(--accent-color); }
        .footer-copyright { text-align: center; padding-top: 25px; margin-top: 20px; border-top: 1px solid rgba(0,0,0,0.05); font-size: 0.75rem; opacity: 0.6; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(60px + var(--safe-bottom)); background: var(--card-bg); box-shadow: 0 -4px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-around; align-items: center; padding-bottom: var(--safe-bottom); z-index: 99; transition: var(--transition); border-top: 1px solid rgba(0,0,0,0.02); }
        .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; color: var(--text-color); opacity: 0.6; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: var(--transition); gap: 4px; }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { opacity: 1; color: var(--accent-color); }
        .modal { position: fixed; top: 0; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000; padding: 10px; }
        .modal.ativo { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-color); width: 100%; max-width: 500px; border-radius: 24px 24px 12px 12px; padding: 20px; box-shadow: var(--shadow); max-height: 85vh; overflow-y: auto; transform: translateY(100px); transition: transform 0.3s ease; position: relative; color: var(--text-color); }
        .modal.ativo .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 10px; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-color); cursor: pointer; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.9rem; font-weight: 600; }
        .form-control { width: 100%; padding: 12px; border: 1px solid rgba(0,0,0,0.1); background: var(--card-bg); color: var(--text-color); border-radius: 12px; font-size: 1rem; transition: var(--transition); }
        body.dark .form-control { border-color: rgba(255,255,255,0.1); }
        .form-control:focus { outline: none; border-color: var(--accent-color); }
        .btn-block { width: 100%; padding: 12px; border: none; background: var(--accent-color); color: white; font-weight: bold; border-radius: 12px; cursor: pointer; font-size: 1rem; }
        .btn-secondary { background: #999; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
        .admin-section { max-width: 1200px; margin: 15px auto; padding: 0 15px; display: none; }
        .admin-section.ativo { display: block; }
        .toast { position: fixed; bottom: 30px; left: 20px; right: 20px; background: #333; color: white; padding: 12px 24px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 10000; display: none; font-weight: 600; animation: slideIn 0.3s ease; text-align: center; }
        .toast.error { background: #e63946; }
        .toast.success { background: #2a9d8f; }
        @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .carrinho-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .carrinho-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
        .carrinho-details { flex-grow: 1; }
        .carrinho-qtd-control { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .btn-qtd { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); background: var(--card-bg); color: var(--text-color); font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-remover { background: none; border: none; color: #e63946; cursor: pointer; }
        .user-menu-container { position: relative; display: inline-block; }
        .user-dropdown { position: absolute; top: 100%; right: 0; background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); display: none; min-width: 160px; z-index: 150; border: 1px solid rgba(0,0,0,0.05); overflow: hidden; padding: 5px 0; }
        .user-dropdown.show { display: block; }
        .user-dropdown button { width: 100%; padding: 10px 15px; text-align: left; background: none; border: none; color: var(--text-color); font-size: 0.9rem; cursor: pointer; font-weight: 500; }
        .user-dropdown button:hover { background: rgba(0,0,0,0.03); }
        body.dark .user-dropdown button:hover { background: rgba(255,255,255,0.05); }
        .highlight-product { box-shadow: 0 0 0 3px var(--accent-color) !important; transition: box-shadow 0.3s ease; }
        .avaliacao-modal { display: flex; gap: 5px; margin: 10px 0; justify-content: center; }
        .avaliacao-star { font-size: 2rem; cursor: pointer; color: #ddd; transition: color 0.2s; }
        .avaliacao-star.selected, .avaliacao-star:hover { color: #ffb703; }
        .avaliacao-comentario { width: 100%; padding: 8px; border-radius: 12px; border: 1px solid #ddd; margin-top: 10px; }
        .btn-avaliar { background: var(--accent-color); color: white; border: none; padding: 8px 16px; border-radius: 25px; cursor: pointer; margin-top: 10px; }
        .admin-nav-tabs, .admin-sub-panel, .admin-list-container, .produto-admin-item, .admin-item-row, .btn-icon { /* resumido, mas funcional */ }
        .admin-tab-btn { padding: 8px 16px; border: none; background: var(--card-bg); color: var(--text-color); border-radius: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow); }
        .admin-tab-btn.active { background: var(--text-color); color: var(--bg-color); }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="logo-area" id="btnLogoHome" style="cursor: pointer;">
            <img id="headerLogo" src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=100&q=80" alt="Logo">
            <span id="storeNameSpan">Doces Di</span>
        </div>
        <div class="header-actions">
            <button class="btn-header" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
            <button class="btn-header" id="btnAbrirCarrinho">
                <i class="fa-solid fa-shopping-bag"></i>
                <span class="badge" id="carrinhoBadge">0</span>
            </button>
            <div id="perfilButtonArea" style="display: none;">
                <button class="btn-perfil" id="btnAbrirPerfil"><i class="fa-solid fa-user-circle"></i> Minha Conta</button>
            </div>
            <div class="user-menu-container">
                <button class="btn-header" id="btnUserMenu"><i class="fa-solid fa-user"></i></button>
                <div class="user-dropdown" id="usuarioDropdown">
                    <button id="menuBtnLogin" onclick="abrirModal('modalCliente')">Entrar / Cadastrar</button>
                    <button id="menuBtnPedidos" onclick="abrirMeusPedidos()" style="display:none;">Meus Pedidos</button>
                    <button id="menuBtnAdmin" onclick="abrirAdmin()" style="display:none;">Painel Geral</button>
                    <button id="menuBtnLogout" onclick="efetuarLogout()" style="display:none; color: red;">Sair</button>
                </div>
            </div>
        </div>
    </header>

    <div class="thermometer-bar" id="weatherBar">
        <div class="thermometer-info">
            <div class="temp-display">
                <i class="fa-solid fa-temperature-high" id="tempIcon"></i>
                <span class="temp-value" id="tempValue">--</span>
                <span class="temp-unit">°C</span>
            </div>
            <div class="weather-status" id="weatherStatus">
                <i class="fa-solid fa-cloud-sun"></i>
                <span id="weatherDesc">Carregando clima...</span>
            </div>
        </div>
        <div class="suggestion-card" id="suggestionCard" onclick="scrollToSugestao()">
            <i class="fa-solid fa-ice-cream" id="suggestionIcon"></i>
            <span class="suggestion-text" id="suggestionText">Analisando cardápio...</span>
        </div>
        <button class="refresh-weather" id="refreshWeatherBtn" onclick="buscarClima()"><i class="fa-solid fa-sync-alt"></i></button>
    </div>

    <main id="viewCliente">
        <div class="hero-slider">
            <div class="swiper hero-swiper" id="heroSwiper">
                <div class="swiper-wrapper" id="slidesWrapper"></div>
                <div class="swiper-pagination"></div>
            </div>
        </div>
        <div class="tabs-container" id="tabsCategoriasFront"></div>
        <div class="produtos-carrossel-wrapper" id="produtosWrapper"></div>
    </main>

    <footer class="site-footer" id="siteFooter">
        <div class="footer-grid" id="footerContent"></div>
        <div class="footer-copyright" id="footerCopyright">© 2024 Doces Di - Todos os direitos reservados</div>
    </footer>

    <main id="viewAdmin" class="admin-section">
        <h1 style="margin-bottom:15px; font-size:1.8rem;">Painel de Controle Geral</h1>
        <div class="admin-nav-tabs" id="adminMainTabs">
            <button class="admin-tab-btn active" data-target="panelCategorias">Categorias</button>
            <button class="admin-tab-btn" data-target="panelProdutos">Produtos</button>
            <button class="admin-tab-btn" data-target="panelEstoque">Estoque / Materiais</button>
            <button class="admin-tab-btn" data-target="panelSlides">Banners / Slides</button>
            <button class="admin-tab-btn" data-target="panelPedidos">Pedidos Recebidos</button>
        </div>
        <div id="panelCategorias" class="admin-sub-panel ativo">...</div>
        <div id="panelProdutos" class="admin-sub-panel">...</div>
        <div id="panelEstoque" class="admin-sub-panel">...</div>
        <div id="panelSlides" class="admin-sub-panel">...</div>
        <div id="panelPedidos" class="admin-sub-panel">...</div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" id="navHome"><i class="fa-solid fa-home"></i>Início</button>
        <button class="nav-item" id="navPedidos" onclick="abrirMeusPedidosCard()"><i class="fa-solid fa-receipt"></i>Pedidos</button>
        <button class="nav-item" id="navSuporte" onclick="abrirWhatsApp()"><i class="fa-brands fa-whatsapp"></i>Suporte</button>
        <button class="nav-item" id="navAdminBtn" style="display:none;" onclick="abrirAdmin()"><i class="fa-solid fa-gear"></i>Admin</button>
    </nav>

    <div class="toast" id="toastNotification"></div>

    <!-- MODAL CARRINHO -->
    <div class="modal" id="modalCarrinho">
        <div class="modal-content">
            <div class="modal-header"><h2>Seu Carrinho</h2><button class="modal-close" onclick="fecharModal('modalCarrinho')">&times;</button></div>
            <div id="carrinhoListaItens"></div>
            <div style="margin-top:20px; border-top:1px solid rgba(0,0,0,0.05); padding-top:15px;">
                <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.2rem; margin-bottom:15px;"><span>Total:</span><span id="carrinhoValorTotal">R$ 0,00</span></div>
                <button class="btn-block" onclick="avancarParaPagamento()">Finalizar e Pagar</button>
            </div>
        </div>
    </div>

    <!-- MODAL ENTREGA PARA VISITANTE -->
    <div class="modal" id="modalEntregaVisitante">
        <div class="modal-content">
            <div class="modal-header"><h2>Escolha a entrega</h2><button class="modal-close" onclick="fecharModal('modalEntregaVisitante')">&times;</button></div>
            <div class="form-group">
                <label>Tipo de Entrega:</label>
                <select id="visitanteTipoEntrega" class="form-control" onchange="toggleVisitanteEndereco()">
                    <option value="retirada">Retirar no Local (Grátis)</option>
                    <option value="entrega">Receber por Delivery</option>
                </select>
            </div>
            <div id="visitanteEnderecoDiv" style="display:none; border:1px solid rgba(0,0,0,0.05); padding:10px; border-radius:10px; margin-bottom:15px;">
                <div class="form-group"><input type="text" id="visitanteCep" class="form-control" placeholder="CEP (Apenas números)"></div>
                <div class="form-group"><input type="text" id="visitanteLogradouro" class="form-control" placeholder="Endereço, Número e Bairro"></div>
            </div>
            <button class="btn-block" onclick="confirmarEntregaVisitante()">Continuar para pagamento</button>
        </div>
    </div>

    <!-- MODAL CLIENTE (LOGIN/CADASTRO) -->
    <div class="modal" id="modalCliente">
        <div class="modal-content">
            <div class="modal-header"><h2 id="modalClienteTitulo">Identificação</h2><button class="modal-close" onclick="fecharModal('modalCliente')">&times;</button></div>
            <div id="panelLoginCadastro">
                <div class="form-group"><label>Seu WhatsApp:</label><input type="tel" id="cadTelefone" class="form-control" placeholder="(00) 00000-0000"></div>
                <div class="form-group"><label>Senha:</label><input type="password" id="cadSenha" class="form-control" placeholder="Sua senha"></div>
                <div class="checkbox-group"><input type="checkbox" id="rememberMeCheckbox"><label for="rememberMeCheckbox">Lembrar-me</label></div>
                <button class="btn-block" id="btnAcaoCliente" onclick="verificarIdentificacaoCliente()" style="margin-top:10px;">Entrar</button>
                <button class="btn-block btn-secondary" id="btnEsqueciSenha" style="margin-top:10px;">Esqueci minha senha</button>
                <button class="btn-block" id="btnComprarSemLogin" style="background:none; color:var(--text-color); font-size:0.85rem; border:1px solid rgba(0,0,0,0.1); margin-top:10px;">Continuar como Visitante</button>
                <div id="camposCadastroAdicionais" style="display:none; margin-top:15px;">

        // ========== GÊNERO E CONCORDÂNCIA ==========
        function generoDoProduto(nome) {
            const femininas = ['canjica', 'pamonha', 'tapioca', 'cuca', 'broa', 'fubá', 'curau', 'mousse', 'pavê', 'rabanada'];
            const masculinas = ['bolo', 'sorvete', 'milkshake', 'picolé', 'smoothie', 'café', 'chocolate', 'quente', 'biscoito', 'donut', 'cupcake', 'pirulito', 'salgado', 'pão', 'doce', 'torta'];
            const nomeLower = nome.toLowerCase();
            if (femininas.includes(nomeLower)) return 'feminino';
            if (masculinas.includes(nomeLower)) return 'masculino';
            if (nomeLower.endsWith('a') || nomeLower.endsWith('ção') || nomeLower.endsWith('ade')) return 'feminino';
            if (nomeLower.endsWith('o') || nomeLower.endsWith('e') || nomeLower.endsWith('l') || nomeLower.endsWith('r')) return 'masculino';
            return 'masculino';
        }
        function artigoEAdjetivo(genero, adjetivoBase) {
            let artigo = genero === 'feminino' ? 'uma' : 'um';
            let adjetivo = adjetivoBase;
            if (genero === 'feminino' && adjetivoBase.endsWith('o')) adjetivo = adjetivoBase.slice(0, -1) + 'a';
            else if (genero === 'feminino' && adjetivoBase === 'quentinho') adjetivo = 'quentinha';
            else if (genero === 'feminino' && adjetivoBase === 'geladinho') adjetivo = 'geladinha';
            return { artigo, adjetivo };
        }

        // ========== SUGESTÃO COM CONCORDÂNCIA ==========
        function gerarSugestaoPorClima() {
            const suggestionText = document.getElementById('suggestionText');
            const suggestionIcon = document.getElementById('suggestionIcon');
            if (temperaturaAtual === null) { suggestionText.innerText = 'Carregando cardápio...'; return; }
            if (produtos.length === 0) { suggestionText.innerText = 'Adicione produtos ao cardápio!'; return; }
            const produtosDisponiveis = produtos.filter(p => p.estoque > 0);
            if (produtosDisponiveis.length === 0) { suggestionText.innerText = 'Produtos em breve!'; return; }

            let produtosSugeridos = [], tipoSugestao = '', iconClass = '', iconColor = '', adjetivoBase = '';
            const palavrasGeladas = palavrasChaveClima.quentes || [];
            const palavrasFrescas = palavrasChaveClima.amenas || [];
            const palavrasQuentes = palavrasChaveClima.frias || [];

            if (temperaturaAtual >= 26) {
                tipoSugestao = 'gelada'; iconClass = 'fa-solid fa-ice-cream'; iconColor = '#4ecdc4'; adjetivoBase = 'geladinho';
                produtosSugeridos = produtosDisponiveis.filter(p => {
                    const nomeLower = p.nome.toLowerCase(), descLower = (p.descricao || '').toLowerCase();
                    const cat = categorias.find(c => c.id === p.categoria_id);
                    const catNome = cat ? cat.nome.toLowerCase() : '';
                    return palavrasGeladas.some(palavra => nomeLower.includes(palavra) || descLower.includes(palavra) || catNome.includes(palavra));
                });
            } else if (temperaturaAtual >= 20) {
                tipoSugestao = 'refrescante'; iconClass = 'fa-solid fa-lemon'; iconColor = '#ffb703'; adjetivoBase = 'refrescante';
                produtosSugeridos = produtosDisponiveis.filter(p => {
                    const nomeLower = p.nome.toLowerCase(), descLower = (p.descricao || '').toLowerCase();
                    const cat = categorias.find(c => c.id === p.categoria_id);
                    const catNome = cat ? cat.nome.toLowerCase() : '';
                    return palavrasFrescas.some(palavra => nomeLower.includes(palavra) || descLower.includes(palavra) || catNome.includes(palavra));
                });
            } else {
                tipoSugestao = 'quente'; iconClass = 'fa-solid fa-mug-hot'; iconColor = '#ff6b6b'; adjetivoBase = 'quentinho';
                produtosSugeridos = produtosDisponiveis.filter(p => {
                    const nomeLower = p.nome.toLowerCase(), descLower = (p.descricao || '').toLowerCase();
                    const cat = categorias.find(c => c.id === p.categoria_id);
                    const catNome = cat ? cat.nome.toLowerCase() : '';
                    return palavrasQuentes.some(palavra => nomeLower.includes(palavra) || descLower.includes(palavra) || catNome.includes(palavra));
                });
            }
            if (produtosSugeridos.length === 0) produtosSugeridos = [...produtosDisponiveis];
            const produtoEscolhido = produtosSugeridos[Math.floor(Math.random() * produtosSugeridos.length)];
            const genero = generoDoProduto(produtoEscolhido.nome);
            const { artigo, adjetivo } = artigoEAdjetivo(genero, adjetivoBase);
            let mensagem = '';
            if (tipoSugestao === 'gelada') mensagem = `🍦 ${artigo.charAt(0).toUpperCase() + artigo.slice(1)} ${produtoEscolhido.nome} ${adjetivo} cai bem!`;
            else if (tipoSugestao === 'refrescante') mensagem = `🍋 ${artigo.charAt(0).toUpperCase() + artigo.slice(1)} ${produtoEscolhido.nome} ${adjetivo} é perfeito!`;
            else mensagem = `☕ ${artigo.charAt(0).toUpperCase() + artigo.slice(1)} ${produtoEscolhido.nome} ${adjetivo} te aquece!`;
            sugestaoAtual = { id: produtoEscolhido.id, nome: produtoEscolhido.nome, tipo: tipoSugestao, categoria_id: produtoEscolhido.categoria_id };
            suggestionIcon.className = iconClass; suggestionIcon.style.color = iconColor;
            suggestionText.innerText = mensagem;
        }

        function scrollToSugestao() {

        async function buscarClima() {
            const suggestionCard = document.getElementById('suggestionCard');
            if (suggestionCard) suggestionCard.style.opacity = '0.7';
            try {
                const posicao = await new Promise((resolve, reject) => { if (navigator.geolocation) navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 }); else reject(new Error()); });
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${posicao.coords.latitude}&longitude=${posicao.coords.longitude}&current_weather=true&timezone=auto`);
                const data = await res.json();
                if (data.current_weather) { temperaturaAtual = data.current_weather.temperature; atualizarTermometroUI(); gerarSugestaoPorClima(); }
                else throw new Error();
            } catch (error) {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=-23.5505&longitude=-46.6333&current_weather=true&timezone=auto`);
                const data = await res.json();
                temperaturaAtual = data.current_weather?.temperature || 22;
                atualizarTermometroUI(); gerarSugestaoPorClima();
            }
            if (suggestionCard) suggestionCard.style.opacity = '1';
        }
        function atualizarTermometroUI() {
            const tempValue = document.getElementById('tempValue');
            const tempIcon = document.getElementById('tempIcon');
            const weatherDesc = document.getElementById('weatherDesc');
            if (temperaturaAtual !== null) {
                tempValue.innerText = Math.round(temperaturaAtual);
                if (temperaturaAtual >= 28) { tempIcon.className = 'fa-solid fa-temperature-high'; tempIcon.style.color = 'var(--hot-color)'; weatherDesc.innerText = '🌞 Muito calor!'; }
                else if (temperaturaAtual >= 22) { tempIcon.className = 'fa-solid fa-temperature-high'; tempIcon.style.color = '#ffb703'; weatherDesc.innerText = '☀️ Clima agradável'; }
                else if (temperaturaAtual >= 15) { tempIcon.className = 'fa-solid fa-temperature-low'; tempIcon.style.color = '#4ecdc4'; weatherDesc.innerText = '🌤️ Temperatura amena'; }
                else { tempIcon.className = 'fa-solid fa-temperature-low'; tempIcon.style.color = 'var(--cold-color)'; weatherDesc.innerText = '❄️ Está friozinho!'; }
            }
        }

        function adicionarAoCarrinho(idProd) {
            const prod = produtos.find(p => p.id === idProd);
            if(!prod || prod.estoque <= 0) { showToast("Produto indisponível", 'error'); return; }
            const item = carrinho.find(c => c.produto_id === idProd);
            if(item) { if(item.quantidade + 1 > prod.estoque) { showToast("Estoque máximo atingido", 'error'); return; } item.quantidade++; }
            else carrinho.push({ produto_id: idProd, quantidade: 1, preco_unitario: prod.preco, nome: prod.nome, imagem: prod.imagem });
            salvarCarrinho(); showToast(`${prod.nome} adicionado!`);
        }
        function alterarQtdCarrinho(idProd, delta) {
            const item = carrinho.find(c => c.produto_id === idProd);
            if(!item) return;
            const prod = produtos.find(p => p.id === idProd);
            item.quantidade += delta;
            if(item.quantidade <= 0) carrinho = carrinho.filter(c => c.produto_id !== idProd);
            else if(prod && item.quantidade > prod.estoque) { item.quantidade = prod.estoque; showToast("Estoque máximo atingido", 'error'); }
            salvarCarrinho(); renderizarCarrinhoItens();
        }
        function removerDoCarrinho(idProd) { carrinho = carrinho.filter(c => c.produto_id !== idProd); salvarCarrinho(); renderizarCarrinhoItens(); }
        function renderizarCarrinhoItens() {
            const container = document.getElementById('carrinhoListaItens');
            if(!container) return;
            if(carrinho.length === 0) { container.innerHTML = '<p style="text-align:center; padding:20px;">Carrinho vazio.</p>'; document.getElementById('carrinhoValorTotal').innerText = 'R$ 0,00'; return; }
            let total = 0;
            container.innerHTML = carrinho.map(item => {
                const prod = produtos.find(p => p.id === item.produto_id);
                if(!prod) return '';
                const sub = item.quantidade * item.preco_unitario;
                total += sub;
                return `<div class="carrinho-item"><img src="${prod.imagem || 'https://placehold.co/60x60'}"><div class="carrinho-details"><div style="font-weight:600;">${prod.nome}</div><div style="font-size:0.85rem; color:var(--accent-color);">R$ ${item.preco_unitario.toFixed(2)}</div><div class="carrinho-qtd-control"><button class="btn-qtd" onclick="alterarQtdCarrinho(${item.produto_id}, -1)">-</button><span>${item.quantidade}</span><button class="btn-qtd" onclick="alterarQtdCarrinho(${item.produto_id}, 1)">+</button><button class="btn-remover" onclick="removerDoCarrinho(${item.produto_id})"><i class="fa fa-trash"></i></button></div></div><div style="font-weight:700;">R$ ${sub.toFixed(2)}</div></div>`;
            }).join('');
            document.getElementById('carrinhoValorTotal').innerText = `R$ ${total.toFixed(2)}`;
        }

        async function processarPagamentoComDados(cliente, tipoEntrega, enderecoFinal) {
            const items = carrinho.map(item => {
                const prod = produtos.find(p => p.id === item.produto_id);
                return { title: prod.nome, quantity: item.quantidade, unit_price: item.preco_unitario, currency_id: "BRL" };
            });
            const payer = cliente ? {
                name: cliente.nome,
                phone: { number: cliente.telefone },
                address: { zip_code: cliente.cep || "", street_name: cliente.endereco || "" }
            } : { name: "Visitante", phone: { number: "" }, address: { zip_code: "", street_name: "" } };
            const back_urls = { success: window.location.href + "?payment=success", failure: window.location.href + "?payment=failure", pending: window.location.href + "?payment=pending" };
            try {
                const FUNCTION_URL = "https://opixfppyhbiyqrilebfb.supabase.co/functions/v1/rapid-processor";
                const response = await fetch(FUNCTION_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ items, payer, back_urls })
                });
                const data = await response.json();
                if(data.init_point) {
                    const total = carrinho.reduce((acc, i) => acc + (i.quantidade * i.preco_unitario), 0);
                    const pedidoPayload = {
                        cliente_id: cliente ? cliente.id : null,
                        itens: carrinho.map(i => ({ produto_id: i.produto_id, quantidade: i.quantidade, preco_unitario: i.preco_unitario })),
                        valor_total: total,
                        status: 'pendente',
                        tipo_entrega: tipoEntrega,
                        endereco_entrega: enderecoFinal,
                        mp_preference_id: data.id
                    };
                    await supabaseClient.from('pedidos').insert([pedidoPayload]);
                    carrinho = [];
                    salvarCarrinho();
                    fecharModal('modalCarrinho');
                    window.location.href = data.init_point;
                } else { showToast("Erro ao criar preferência", 'error'); }
            } catch(e) { showToast("Erro ao conectar com pagamento", 'error'); }
        }

        async function verificarIdentificacaoCliente() {

            if(telefone.length < 10 || !senha) { showToast("Preencha telefone e senha!", 'error'); return; }
            const senhaHash = hashSenha(senha);
            const match = clientes.find(c => c.telefone === telefone && c.senha === senhaHash);
            if(match) {
                usuarioLogado = match;
                salvarLembrar(telefone, senha);
                loginSucesso();

                const addFields = document.getElementById('camposCadastroAdicionais');

                    document.getElementById('modalClienteTitulo').innerText = 'Cadastrar-se';
                    document.getElementById('btnAcaoCliente').innerText = 'Cadastrar';
                    showToast("Telefone ou senha incorretos. Preencha os dados para se cadastrar.", "error");
                } else {
                    await efetuarCadastro(telefone, senhaHash);
                }
            }

        async function efetuarCadastro(telefone, senhaHash) {
            const nome = document.getElementById('cadNome').value.trim();
            const confirmarSenha = document.getElementById('cadConfirmarSenha').value;
            if(hashSenha(confirmarSenha) !== senhaHash) { showToast("Senhas não conferem!", 'error'); return; }

            const cep = document.getElementById('cadCep').value.replace(/\D/g,'');

            try {
                const { data, error } = await supabaseClient.from('clientes').insert([{ nome, telefone, senha: senhaHash, cep, endereco }]).select();
                if(!error && data) {
                    clientes.push(data[0]);
                    usuarioLogado = data[0];
                    salvarLembrar(telefone, document.getElementById('cadSenha').value);

            await carregarClientes();
            await carregarAvaliacoes();
            await carregarMateriais();
            carregarCarrinho();
            carregarLembrar();
            const savedUser = localStorage.getItem('docesdi_usuario_logado');
            if(savedUser) { usuarioLogado = JSON.parse(savedUser); atualizarInterfaceUsuario(); }
            initAdminTabs(); initEstoqueTabs();
            document.getElementById('btnAbrirPerfil')?.addEventListener('click', abrirPerfil);
            window.onclick = (e) => { if(e.target.classList.contains('modal')) e.target.classList.remove('ativo'); };
            document.addEventListener('click', (e) => { const dd = document.getElementById('usuarioDropdown'); if(dd && !dd.contains(e.target)) dd.classList.remove('show'); });
            document.addEventListener('keydown', (e) => { if(e.ctrlKey && e.shiftKey && e.key === 'A') { e.preventDefault(); abrirAdmin(); } });
            document.querySelectorAll('#starSelector .avaliacao-star').forEach(star => star.addEventListener('click', () => { const nota = parseInt(star.dataset.star); atualizarEstrelasModal(nota); }));
            await buscarClima();
            // Abrir modal de login automaticamente se não houver usuário logado
            if (!usuarioLogado) abrirModal('modalCliente');
        }
        inicializar();
    </script>
</body>
</html>
